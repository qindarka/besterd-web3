<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img" aria-label="Besterd Mechanical">
  <title>Besterd Mechanical</title>
  <defs>
    <!-- Chrome gradient on the BESTERD wordmark -->
    <linearGradient id="bm-chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#5a5a5a"/>
      <stop offset="22%"  stop-color="#0d0d0d"/>
      <stop offset="55%"  stop-color="#0a0a0a"/>
      <stop offset="78%"  stop-color="#1f1f1f"/>
      <stop offset="100%" stop-color="#3d3d3d"/>
    </linearGradient>

    <!-- Top highlight overlay -->
    <linearGradient id="bm-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="38%"  stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Silver swoosh gradient -->
    <linearGradient id="bm-swoosh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#9aa1a8"/>
      <stop offset="50%"  stop-color="#e8eaed"/>
      <stop offset="100%" stop-color="#4a5058"/>
    </linearGradient>
  </defs>

  <!-- Sweeping silver swoosh behind the text -->
  <g opacity="0.92">
    <path d="M 6 158 C 110 196, 270 178, 410 122 C 432 113, 458 102, 478 100"
          fill="none" stroke="url(#bm-swoosh)" stroke-width="7" stroke-linecap="round"/>
    <path d="M 18 168 C 124 204, 282 190, 420 134 C 442 124, 462 116, 478 113"
          fill="none" stroke="url(#bm-swoosh)" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
  </g>

  <!-- Canadian flag, top-right -->
  <g transform="translate(434, 6)">
    <rect x="0"  y="0" width="9"  height="22" fill="#d52b1e"/>
    <rect x="9"  y="0" width="18" height="22" fill="#ffffff"/>
    <rect x="27" y="0" width="9"  height="22" fill="#d52b1e"/>
    <!-- Stylized 11-point maple leaf -->
    <path transform="translate(18 11) scale(0.55)"
          d="M0,-13 L2.4,-7 L8,-8 L5.5,-2 L12,0.5 L7,3 L8.5,9 L2,7 L0,13 L-2,7 L-8.5,9 L-7,3 L-12,0.5 L-5.5,-2 L-8,-8 L-2.4,-7 Z"
          fill="#d52b1e"/>
  </g>

  <!-- BESTERD wordmark -->
  <g font-family="'Oswald','Arial Narrow','Helvetica Neue',Impact,sans-serif"
     font-weight="700" font-style="italic" letter-spacing="2">
    <text x="10" y="118" font-size="108" fill="url(#bm-chrome)"
          textLength="418" lengthAdjust="spacingAndGlyphs">BESTERD</text>
    <!-- Specular highlight overlay -->
    <text x="10" y="118" font-size="108" fill="url(#bm-shine)"
          textLength="418" lengthAdjust="spacingAndGlyphs"
          aria-hidden="true">BESTERD</text>
  </g>

  <!-- MECHANICAL subtitle -->
  <g font-family="'Oswald','Arial Narrow','Helvetica Neue',sans-serif" font-weight="500">
    <text x="36" y="170" font-size="34" fill="#0a0a0a"
          letter-spacing="14" textLength="380" lengthAdjust="spacingAndGlyphs">MECHANICAL</text>
  </g>
</svg>
