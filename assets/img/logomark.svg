<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Besterd Mechanical">
  <title>Besterd Mechanical</title>
  <defs>
    <linearGradient id="m-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="m-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="16" fill="url(#m-bg)"/>
  <rect x="2" y="2" width="92" height="46" rx="16" fill="url(#m-shine)"/>
  <!-- Silver swoosh -->
  <path d="M 10 70 C 35 84, 65 78, 88 50"
        fill="none" stroke="#d1d5db" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <!-- BM monogram -->
  <text x="48" y="62" text-anchor="middle"
        font-family="'Oswald','Arial Narrow',Impact,sans-serif"
        font-weight="700" font-size="48" fill="#ffffff" font-style="italic" letter-spacing="-2">BM</text>
  <!-- Canadian red accent dot -->
  <circle cx="80" cy="20" r="6" fill="#d52b1e"/>
</svg>
