<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Besterd Mechanical</title>
<link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --black:#0a0a0a; --red:#d52b1e; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:"Inter",system-ui,sans-serif;color:#e7e9ec;
    background:
      radial-gradient(60% 50% at 80% 20%,rgba(213,43,30,.22),transparent 60%),
      radial-gradient(50% 50% at 0% 100%,rgba(75,85,99,.30),transparent 60%),
      linear-gradient(135deg,#050505 0%,var(--black) 50%,#1a1a1a 100%);
    display:grid;place-items:center;text-align:center;padding:32px;
  }
  .wrap{max-width:560px}
  img{height:72px;margin-bottom:24px}
  h1{font-family:"Oswald",sans-serif;font-size:7rem;margin:0;color:var(--red);font-weight:700;letter-spacing:-.04em;line-height:1}
  h2{font-family:"Oswald",sans-serif;font-size:1.7rem;margin:.4em 0 .6em;color:#fff;font-weight:600}
  p{color:#cbd5d9;line-height:1.6}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--red);color:#fff;padding:13px 26px;border-radius:999px;
    text-decoration:none;font-weight:600;margin-top:24px;border:2px solid var(--red);
    transition:background .15s ease,border-color .15s ease,color .15s ease;
  }
  .btn:hover{background:#fff;color:var(--black);border-color:#fff}
</style>
</head>
<body>
  <div class="wrap">
    <img src="/assets/img/logo-light.svg" alt="Besterd Mechanical">
    <h1>404</h1>
    <h2>Page not found</h2>
    <p>The page you’re looking for doesn’t exist or has been moved.</p>
    <a href="/" class="btn">← Back to home</a>
  </div>
</body>
</html>
