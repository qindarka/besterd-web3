<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Besterd Mechanical</title>
<link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --navy:#0f2a47; --amber:#f59e0b; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:"Inter",system-ui,sans-serif;color:#e5edf7;
    background:radial-gradient(60% 50% at 80% 20%,rgba(245,158,11,.25),transparent 60%),linear-gradient(135deg,#07172b 0%,var(--navy) 60%,#11365b 100%);
    display:grid;place-items:center;text-align:center;padding:32px;
  }
  .wrap{max-width:560px}
  img{height:64px;margin-bottom:24px}
  h1{font-size:6rem;margin:0;color:var(--amber);font-weight:800;letter-spacing:-.04em;line-height:1}
  h2{font-size:1.6rem;margin:.4em 0 .6em}
  p{color:#cbd5e1;line-height:1.6}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--amber);color:#0b1320;padding:12px 22px;border-radius:999px;
    text-decoration:none;font-weight:700;margin-top:20px;
  }
  .btn:hover{background:#fff}
</style>
</head>
<body>
  <div class="wrap">
    <img src="/assets/img/logo-light.svg" alt="Besterd Mechanical">
    <h1>404</h1>
    <h2>Page not found</h2>
    <p>The page you’re looking for doesn’t exist or has been moved.</p>
    <a href="/" class="btn">← Back to home</a>
  </div>
</body>
</html>
